<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <path id="ch1" d="M 640 100 L 760 40" fill="none"/>
    <path id="ch2" d="M 640 100 L 770 100" fill="none"/>
    <path id="ch3" d="M 640 100 L 760 160" fill="none"/>
    <path id="rt1" d="M 760 40 L 830 100" fill="none"/>
    <path id="rt2" d="M 770 100 L 830 100" fill="none"/>
    <path id="rt3" d="M 760 160 L 830 100" fill="none"/>
  </defs>

  <rect width="880" height="200" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="879" height="199" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- guide lines -->
  <line x1="24" y1="30" x2="856" y2="30" stroke="#21262d" stroke-width="1"/>
  <line x1="24" y1="168" x2="856" y2="168" stroke="#21262d" stroke-width="1"/>
  <line x1="560" y1="30" x2="560" y2="168" stroke="#21262d" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- meta labels -->
  <text x="24" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7d8590">&#x2387; main</text>
  <text x="560" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7d8590" text-anchor="start">go1.22 · chan buf=64</text>

  <!-- name block -->
  <text x="24" y="86" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="0.5" fill="#e6edf3">Aveline Quigley</text>
  <text x="25" y="116" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#00ADD1">GO BACKEND &amp; DATA PLATFORM</text>
  <text x="25" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7d8590">Go · PostgreSQL · gRPC · Cloud Run · NATS</text>

  <!-- channels (fan-out) -->
  <use href="#ch1" stroke="#21262d" stroke-width="1"/>
  <use href="#ch2" stroke="#21262d" stroke-width="1"/>
  <use href="#ch3" stroke="#21262d" stroke-width="1"/>
  <!-- returns (fan-in) -->
  <use href="#rt1" stroke="#21262d" stroke-width="1"/>
  <use href="#rt2" stroke="#21262d" stroke-width="1"/>
  <use href="#rt3" stroke="#21262d" stroke-width="1"/>

  <!-- dispatcher node -->
  <rect x="622" y="88" width="36" height="24" rx="3" fill="#161b22" stroke="#00ADD1" stroke-width="1.2"/>
  <text x="640" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#00ADD1" text-anchor="middle">disp</text>

  <!-- worker nodes -->
  <circle cx="760" cy="40" r="5" fill="#161b22" stroke="#58a6a6" stroke-width="1.2"/>
  <circle cx="770" cy="100" r="5" fill="#161b22" stroke="#58a6a6" stroke-width="1.2"/>
  <circle cx="760" cy="160" r="5" fill="#161b22" stroke="#58a6a6" stroke-width="1.2"/>

  <!-- collector node -->
  <rect x="818" y="90" width="24" height="20" rx="3" fill="#161b22" stroke="#58a6a6" stroke-width="1.2"/>
  <text x="830" y="103" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#58a6a6" text-anchor="middle">in</text>

  <!-- packets fan-out -->
  <circle r="2.4" fill="#00ADD1">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"><mpath href="#ch1"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.4" fill="#00ADD1">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0.8s"><mpath href="#ch2"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle r="2.4" fill="#00ADD1">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="1.6s"><mpath href="#ch3"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="1.6s"/>
  </circle>

  <!-- packets fan-in -->
  <circle r="2" fill="#58a6a6">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s"><mpath href="#rt1"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle r="2" fill="#58a6a6">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="2s"><mpath href="#rt2"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle r="2" fill="#58a6a6">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0.4s"><mpath href="#rt3"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="0.4s"/>
  </circle>

  <!-- worker pulse -->
  <circle cx="770" cy="100" r="8" fill="none" stroke="#58a6a6" stroke-width="1">
    <animate attributeName="r" values="6;11;6" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- version + blinking cursor -->
  <text x="856" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7d8590" text-anchor="end">v1.4.2</text>
  <rect x="822" y="149" width="7" height="11" fill="#00ADD1">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>